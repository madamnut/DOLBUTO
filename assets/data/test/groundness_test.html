<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DOLBUTO Terrain Formula Test</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #111315;
      --panel: #1b1f22;
      --line: #30373d;
      --text: #dfe6ec;
      --muted: #98a5ad;
      --accent: #72b6b0;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Segoe UI, Arial, sans-serif;
      font-size: 13px;
    }

    .app {
      display: grid;
      grid-template-columns: 300px minmax(0, 1fr) 300px;
      height: 100vh;
      min-height: 720px;
    }

    aside {
      border-right: 1px solid var(--line);
      background: var(--panel);
      overflow: auto;
      padding: 14px;
    }

    aside.right {
      border-right: 0;
      border-left: 1px solid var(--line);
    }

    main {
      display: block;
      min-width: 0;
      min-height: 0;
    }

    .canvas-wrap {
      display: grid;
      place-items: center;
      min-width: 0;
      min-height: 0;
      height: 100vh;
      overflow: auto;
      padding: 16px;
    }

    canvas {
      width: min(1024px, 100%);
      height: auto;
      aspect-ratio: 1 / 1;
      image-rendering: pixelated;
      background: #05070a;
      box-shadow: 0 0 0 1px #000, 0 10px 28px rgba(0, 0, 0, 0.45);
    }

    h1,
    h2 {
      margin: 0;
      font-weight: 650;
      letter-spacing: 0;
    }

    h1 {
      font-size: 15px;
    }

    h2 {
      margin-top: 16px;
      margin-bottom: 8px;
      font-size: 12px;
      color: var(--muted);
      text-transform: uppercase;
    }

    label {
      display: grid;
      grid-template-columns: 1fr 92px;
      align-items: center;
      gap: 8px;
      margin: 8px 0;
      color: var(--muted);
    }

    input,
    select,
    button {
      border: 1px solid var(--line);
      background: #111519;
      color: var(--text);
      border-radius: 6px;
      font: inherit;
    }

    input,
    select {
      min-width: 0;
      padding: 6px 7px;
    }

    input[type="checkbox"] {
      width: 16px;
      height: 16px;
      justify-self: end;
    }

    input[type="color"] {
      width: 42px;
      height: 28px;
      padding: 2px;
    }

    button {
      cursor: pointer;
      padding: 7px 10px;
    }

    button.primary {
      border-color: #4e908a;
      background: #213b3a;
    }

    button:disabled {
      cursor: default;
      opacity: 0.5;
    }

    .buttons {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }

    .status {
      color: var(--muted);
      white-space: nowrap;
    }

    .meter {
      height: 8px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #0c0f12;
      overflow: hidden;
      margin-top: 10px;
    }

    .meter > div {
      width: 0;
      height: 100%;
      background: var(--accent);
    }

    .stat {
      color: var(--muted);
      font-size: 12px;
    }

    .stats {
      display: grid;
      gap: 5px;
      margin-top: 8px;
    }

    .readout {
      display: grid;
      gap: 5px;
      padding: 9px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #121619;
    }
  </style>
</head>
<body>
  <div class="app">
    <aside>
      <h1>Terrain Formula Test</h1>

      <h2>Sampling</h2>
      <label>View Mode
        <select id="viewMode">
          <option value="gnd">GND</option>
          <option value="smth">SMTH</option>
          <option value="weirdness">W</option>
          <option value="pv">PV</option>
          <option value="baseNoise">baseNoise</option>
          <option value="landBase">landBase</option>
          <option value="reliefAmount">reliefAmount</option>
          <option value="ridgeMask">ridgeMask</option>
          <option value="valleyMask">valleyMask</option>
          <option value="detailRelief">detailRelief</option>
          <option value="ridgeContribution">ridgeContribution</option>
          <option value="valleyContribution">valleyContribution</option>
          <option value="val">VAL</option>
        </select>
      </label>
      <label>Canvas Size <input id="sampleSize" type="number" min="64" max="1024" step="64" value="1024"></label>
      <label>World Extent <input id="worldExtent" type="number" min="64" max="65536" step="64" value="4096"></label>
      <label>World Period <input id="worldPeriod" type="number" min="64" max="65536" step="64" value="65536"></label>

      <h2>Groundness Noise</h2>
      <label>Seed <input id="seed" type="number" step="1" value="1801"></label>
      <label>Feature Scale <input id="featureScale" type="number" min="1" step="1" value="4000"></label>
      <label>Octaves <input id="octaves" type="number" min="1" max="12" step="1" value="4"></label>
      <label>Lacunarity <input id="lacunarity" type="number" min="1" step="0.1" value="2.0"></label>
      <label>Gain <input id="gain" type="number" min="0" step="0.05" value="0.5"></label>

      <h2>Groundness Warp</h2>
      <label>Enabled <input id="warpEnabled" type="checkbox" checked></label>
      <label>Amplitude <input id="warpAmplitude" type="number" min="0" step="0.05" value="0.3"></label>
      <label>Frequency <input id="warpFrequency" type="number" min="0.01" step="0.1" value="1.5"></label>
      <label>Octaves <input id="warpOctaves" type="number" min="1" max="8" step="1" value="2"></label>
      <label>Gain <input id="warpGain" type="number" min="0" step="0.05" value="0.5"></label>

      <h2>Smoothness Noise</h2>
      <label>Seed <input id="smthSeed" type="number" step="1" value="1803"></label>
      <label>Feature Scale <input id="smthFeatureScale" type="number" min="1" step="1" value="4000"></label>
      <label>Octaves <input id="smthOctaves" type="number" min="1" max="12" step="1" value="2"></label>
      <label>Lacunarity <input id="smthLacunarity" type="number" min="1" step="0.1" value="2.0"></label>
      <label>Gain <input id="smthGain" type="number" min="0" step="0.05" value="0.5"></label>

      <h2>Base Noise</h2>
      <label>Seed <input id="baseSeed" type="number" step="1" value="1802"></label>
      <label>Feature Scale <input id="baseFeatureScale" type="number" min="1" step="1" value="2000"></label>
      <label>Octaves <input id="baseOctaves" type="number" min="1" max="12" step="1" value="2"></label>
      <label>Lacunarity <input id="baseLacunarity" type="number" min="1" step="0.1" value="2.0"></label>
      <label>Gain <input id="baseGain" type="number" min="0" step="0.05" value="0.5"></label>

      <h2>Weirdness Noise</h2>
      <label>Seed <input id="weirdSeed" type="number" step="1" value="1804"></label>
      <label>Feature Scale <input id="weirdFeatureScale" type="number" min="1" step="1" value="2000"></label>
      <label>Octaves <input id="weirdOctaves" type="number" min="1" max="12" step="1" value="1"></label>
      <label>Lacunarity <input id="weirdLacunarity" type="number" min="1" step="0.1" value="2.0"></label>
      <label>Gain <input id="weirdGain" type="number" min="0" step="0.05" value="0.5"></label>

      <h2>Weirdness Warp</h2>
      <label>Enabled <input id="weirdWarpEnabled" type="checkbox" checked></label>
      <label>Amplitude <input id="weirdWarpAmplitude" type="number" min="0" step="0.05" value="0.3"></label>
      <label>Frequency <input id="weirdWarpFrequency" type="number" min="0.01" step="0.1" value="1.2"></label>
      <label>Octaves <input id="weirdWarpOctaves" type="number" min="1" max="8" step="1" value="2"></label>
      <label>Gain <input id="weirdWarpGain" type="number" min="0" step="0.05" value="0.5"></label>

      <h2>Formula</h2>
      <label>Ridge Height <input id="ridgeHeight" type="number" step="0.05" value="0.55"></label>
      <label>Valley Depth <input id="valleyDepth" type="number" step="0.05" value="0.45"></label>

      <div class="buttons">
        <button id="renderButton" class="primary">Render</button>
        <button id="stopButton" disabled>Stop</button>
      </div>
      <div class="meter"><div id="progress"></div></div>
    </aside>

    <main>
      <div class="canvas-wrap">
        <canvas id="view" width="1024" height="1024"></canvas>
      </div>
    </main>

    <aside class="right">
      <h1>GND Display</h1>
      <div class="readout">
        <div class="stat">Grayscale: low white, high black</div>
        <div class="stat" id="sampleReadout">4096 x 4096 world sample to 1024 x 1024 image</div>
        <div class="stat" id="status">Ready</div>
        <div class="stat" id="cursor">x -, z -, value -</div>
      </div>

      <h2>Stats</h2>
      <div class="readout">
        <div class="stat" id="minMax">min -, max -, avg -</div>
        <div class="stats" id="bandStats"></div>
      </div>
    </aside>
  </div>

  <script>
    const canvas = document.getElementById("view");
    const ctx = canvas.getContext("2d", { willReadFrequently: false });
    const statusEl = document.getElementById("status");
    const cursorEl = document.getElementById("cursor");
    const progressEl = document.getElementById("progress");
    const renderButton = document.getElementById("renderButton");
    const stopButton = document.getElementById("stopButton");
    const bandStatsEl = document.getElementById("bandStats");
    const minMaxEl = document.getElementById("minMax");
    const sampleReadoutEl = document.getElementById("sampleReadout");

    const bands = [
      { name: "abyss", min: -Infinity, max: -0.80, color: "#020817" },
      { name: "deep ocean", min: -0.80, max: -0.40, color: "#061b36" },
      { name: "ocean", min: -0.40, max: -0.30, color: "#0d3f63" },
      { name: "shallow ocean", min: -0.30, max: -0.15, color: "#2a7896" },
      { name: "coast", min: -0.15, max: 0.15, color: "#d9c27b" },
      { name: "lowland", min: 0.15, max: 0.30, color: "#66a84f" },
      { name: "inland", min: 0.30, max: 0.70, color: "#2f6f3f" },
      { name: "highland", min: 0.70, max: 0.90, color: "#8f8a5a" },
      { name: "core highland", min: 0.90, max: Infinity, color: "#d8d2bd" }
    ];

    let cancelRender = false;
    let lastValues = null;
    let lastGroundness = null;
    let lastSettings = null;

    function inputNumber(id) {
      return Number(document.getElementById(id).value);
    }

    function settings() {
      return {
        viewMode: document.getElementById("viewMode").value,
        sampleSize: Math.max(1, Math.min(1024, inputNumber("sampleSize") | 0)),
        worldExtent: Math.max(1, inputNumber("worldExtent")),
        worldPeriod: Math.max(1, inputNumber("worldPeriod")),
        seed: inputNumber("seed") | 0,
        featureScale: Math.max(1, inputNumber("featureScale")),
        octaves: Math.max(1, inputNumber("octaves") | 0),
        lacunarity: Math.max(1, inputNumber("lacunarity")),
        gain: Math.max(0, inputNumber("gain")),
        warpEnabled: document.getElementById("warpEnabled").checked,
        warpAmplitude: Math.max(0, inputNumber("warpAmplitude")),
        warpFrequency: Math.max(0.01, inputNumber("warpFrequency")),
        warpOctaves: Math.max(1, inputNumber("warpOctaves") | 0),
        warpGain: Math.max(0, inputNumber("warpGain")),
        smthSeed: inputNumber("smthSeed") | 0,
        smthFeatureScale: Math.max(1, inputNumber("smthFeatureScale")),
        smthOctaves: Math.max(1, inputNumber("smthOctaves") | 0),
        smthLacunarity: Math.max(1, inputNumber("smthLacunarity")),
        smthGain: Math.max(0, inputNumber("smthGain")),
        baseSeed: inputNumber("baseSeed") | 0,
        baseFeatureScale: Math.max(1, inputNumber("baseFeatureScale")),
        baseOctaves: Math.max(1, inputNumber("baseOctaves") | 0),
        baseLacunarity: Math.max(1, inputNumber("baseLacunarity")),
        baseGain: Math.max(0, inputNumber("baseGain")),
        weirdSeed: inputNumber("weirdSeed") | 0,
        weirdFeatureScale: Math.max(1, inputNumber("weirdFeatureScale")),
        weirdOctaves: Math.max(1, inputNumber("weirdOctaves") | 0),
        weirdLacunarity: Math.max(1, inputNumber("weirdLacunarity")),
        weirdGain: Math.max(0, inputNumber("weirdGain")),
        weirdWarpEnabled: document.getElementById("weirdWarpEnabled").checked,
        weirdWarpAmplitude: Math.max(0, inputNumber("weirdWarpAmplitude")),
        weirdWarpFrequency: Math.max(0.01, inputNumber("weirdWarpFrequency")),
        weirdWarpOctaves: Math.max(1, inputNumber("weirdWarpOctaves") | 0),
        weirdWarpGain: Math.max(0, inputNumber("weirdWarpGain")),
        ridgeHeight: inputNumber("ridgeHeight"),
        valleyDepth: inputNumber("valleyDepth")
      };
    }

    function hexToRgb(hex) {
      const n = Number.parseInt(hex.slice(1), 16);
      return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
    }

    function lerp(a, b, t) {
      return a + (b - a) * t;
    }

    function smoothstep(t) {
      return t * t * (3 - 2 * t);
    }

    function valueRangeForMode(mode) {
      if (mode === "reliefAmount" || mode === "ridgeMask" || mode === "valleyMask") {
        return [0, 1.6];
      }
      if (mode === "ridgeContribution" || mode === "valleyContribution") {
        return [0, 0.8];
      }
      if (mode === "detailRelief") {
        return [-2, 2];
      }
      return [-1, 1];
    }

    function colorForValue(value, mode) {
      const range = valueRangeForMode(mode);
      const clamped = Math.max(range[0], Math.min(range[1], value));
      const normalized = (clamped - range[0]) / Math.max(0.000001, range[1] - range[0]);
      const gray = Math.round((1 - normalized) * 255);
      return [gray, gray, gray];
    }

    function bandIndex(value) {
      for (let i = 0; i < bands.length; i++) {
        if (value >= bands[i].min && value < bands[i].max) {
          return i;
        }
      }
      return bands.length - 1;
    }

    function bandName(value) {
      return bands[bandIndex(value)].name;
    }

    function hash2(ix, iy, seed) {
      let h = (ix | 0) * 374761393 + (iy | 0) * 668265263 + (seed | 0) * 1442695041;
      h = (h ^ (h >>> 13)) * 1274126177;
      h = h ^ (h >>> 16);
      return (h >>> 0) / 4294967295;
    }

    function positiveModulo(value, period) {
      return ((value % period) + period) % period;
    }

    function valueNoisePeriodic(x, y, period, seed) {
      const latticePeriod = Math.max(2, Math.round(period));
      const x0 = Math.floor(x);
      const y0 = Math.floor(y);
      const tx = smoothstep(x - x0);
      const ty = smoothstep(y - y0);
      const x1 = x0 + 1;
      const y1 = y0 + 1;
      const ax = positiveModulo(x0, latticePeriod);
      const bx = positiveModulo(x1, latticePeriod);
      const ay = positiveModulo(y0, latticePeriod);
      const by = positiveModulo(y1, latticePeriod);
      const v00 = hash2(ax, ay, seed) * 2 - 1;
      const v10 = hash2(bx, ay, seed) * 2 - 1;
      const v01 = hash2(ax, by, seed) * 2 - 1;
      const v11 = hash2(bx, by, seed) * 2 - 1;
      const vx0 = lerp(v00, v10, tx);
      const vx1 = lerp(v01, v11, tx);
      return lerp(vx0, vx1, ty);
    }

    function fbmPeriodic(worldX, worldZ, cfg, featureScale, octaveCount, lacunarity, gain, seed) {
      let value = 0;
      let amplitude = 1;
      let frequency = 1;
      for (let octave = 0; octave < octaveCount; octave++) {
        const scaledFeature = featureScale / frequency;
        const period = Math.max(2, cfg.worldPeriod / scaledFeature);
        const x = worldX / scaledFeature;
        const z = worldZ / scaledFeature;
        value += valueNoisePeriodic(x, z, period, seed + octave * 1013) * amplitude;
        amplitude *= gain;
        frequency *= lacunarity;
      }
      return value;
    }

    function groundnessAt(worldX, worldZ, cfg) {
      let x = worldX;
      let z = worldZ;
      if (cfg.warpEnabled && cfg.warpAmplitude > 0) {
        const warpScale = cfg.worldPeriod / cfg.warpFrequency;
        const wx = fbmPeriodic(worldX, worldZ, cfg, warpScale, cfg.warpOctaves, 2.0, cfg.warpGain, cfg.seed + 101) * cfg.warpAmplitude * cfg.featureScale;
        const wz = fbmPeriodic(worldX, worldZ, cfg, warpScale, cfg.warpOctaves, 2.0, cfg.warpGain, cfg.seed + 202) * cfg.warpAmplitude * cfg.featureScale;
        x += wx;
        z += wz;
      }
      return fbmPeriodic(x, z, cfg, cfg.featureScale, cfg.octaves, cfg.lacunarity, cfg.gain, cfg.seed);
    }

    function smoothnessAt(worldX, worldZ, cfg) {
      return fbmPeriodic(worldX, worldZ, cfg, cfg.smthFeatureScale, cfg.smthOctaves, cfg.smthLacunarity, cfg.smthGain, cfg.smthSeed);
    }

    function baseNoiseAt(worldX, worldZ, cfg) {
      return fbmPeriodic(worldX, worldZ, cfg, cfg.baseFeatureScale, cfg.baseOctaves, cfg.baseLacunarity, cfg.baseGain, cfg.baseSeed);
    }

    function weirdnessAt(worldX, worldZ, cfg) {
      let x = worldX;
      let z = worldZ;
      if (cfg.weirdWarpEnabled && cfg.weirdWarpAmplitude > 0) {
        const warpScale = cfg.worldPeriod / cfg.weirdWarpFrequency;
        const wx = fbmPeriodic(worldX, worldZ, cfg, warpScale, cfg.weirdWarpOctaves, 2.0, cfg.weirdWarpGain, cfg.weirdSeed + 101) * cfg.weirdWarpAmplitude * cfg.weirdFeatureScale;
        const wz = fbmPeriodic(worldX, worldZ, cfg, warpScale, cfg.weirdWarpOctaves, 2.0, cfg.weirdWarpGain, cfg.weirdSeed + 202) * cfg.weirdWarpAmplitude * cfg.weirdFeatureScale;
        x += wx;
        z += wz;
      }
      return fbmPeriodic(x, z, cfg, cfg.weirdFeatureScale, cfg.weirdOctaves, cfg.weirdLacunarity, cfg.weirdGain, cfg.weirdSeed);
    }

    function pvFromWeirdness(weirdness) {
      return 1 - Math.abs(3 * Math.abs(weirdness) - 2);
    }

    function sampleCurve(points, value) {
      if (value <= points[0][0]) {
        return points[0][1];
      }
      const last = points[points.length - 1];
      if (value >= last[0]) {
        return last[1];
      }
      for (let i = 1; i < points.length; i++) {
        const left = points[i - 1];
        const right = points[i];
        if (value <= right[0]) {
          const span = right[0] - left[0];
          const t = span <= 0 ? 0 : (value - left[0]) / span;
          return lerp(left[1], right[1], t);
        }
      }
      return last[1];
    }

    const landBaseCurve = [
      [-2.0, -1.35],
      [-0.80, -1.15],
      [-0.40, -0.82],
      [-0.30, -0.66],
      [-0.15, -0.38],
      [0.15, -0.05],
      [0.30, 0.12],
      [0.70, 0.45],
      [0.90, 0.75],
      [2.0, 1.05]
    ];

    const reliefCurve = [
      [-2.0, 1.45],
      [-1.0, 1.35],
      [-0.50, 1.10],
      [0.0, 0.80],
      [0.50, 0.45],
      [1.0, 0.20],
      [2.0, 0.15]
    ];

    const ridgeCurve = [
      [-2.0, 0.0],
      [-0.20, 0.0],
      [0.25, 0.10],
      [0.55, 0.45],
      [0.80, 0.80],
      [1.0, 1.0],
      [2.0, 1.0]
    ];

    const valleyCurve = [
      [-2.0, 1.0],
      [-1.0, 1.0],
      [-0.50, 0.70],
      [-0.15, 0.25],
      [0.10, 0.0],
      [2.0, 0.0]
    ];

    function maskRange(value, edge0, edge1) {
      const t = Math.max(0, Math.min(1, (value - edge0) / Math.max(0.000001, edge1 - edge0)));
      return smoothstep(t);
    }

    function terrainAt(worldX, worldZ, cfg) {
      const gnd = groundnessAt(worldX, worldZ, cfg);
      const smth = smoothnessAt(worldX, worldZ, cfg);
      const weirdness = weirdnessAt(worldX, worldZ, cfg);
      const pv = pvFromWeirdness(weirdness);
      const baseNoise = baseNoiseAt(worldX, worldZ, cfg);
      const landMask = maskRange(gnd, -0.15, 0.25);
      const landBase = sampleCurve(landBaseCurve, gnd);
      const reliefAmount = sampleCurve(reliefCurve, smth);
      const ridgeMask = sampleCurve(ridgeCurve, pv) * landMask;
      const valleyMask = sampleCurve(valleyCurve, pv) * landMask;
      const detailRelief = baseNoise * reliefAmount;
      const ridgeContribution = ridgeMask * cfg.ridgeHeight * (0.75 + reliefAmount * 0.25);
      const valleyContribution = valleyMask * cfg.valleyDepth;
      const val = landBase + detailRelief + ridgeContribution - valleyContribution;
      return {
        gnd,
        smth,
        weirdness,
        pv,
        baseNoise,
        landBase,
        reliefAmount,
        ridgeMask,
        valleyMask,
        detailRelief,
        ridgeContribution,
        valleyContribution,
        val
      };
    }

    function valueForMode(sample, mode) {
      if (mode === "gnd") return sample.gnd;
      if (mode === "smth") return sample.smth;
      if (mode === "weirdness") return sample.weirdness;
      if (mode === "pv") return sample.pv;
      if (mode === "baseNoise") return sample.baseNoise;
      if (mode === "landBase") return sample.landBase;
      if (mode === "reliefAmount") return sample.reliefAmount;
      if (mode === "ridgeMask") return sample.ridgeMask;
      if (mode === "valleyMask") return sample.valleyMask;
      if (mode === "detailRelief") return sample.detailRelief;
      if (mode === "ridgeContribution") return sample.ridgeContribution;
      if (mode === "valleyContribution") return sample.valleyContribution;
      return sample.val;
    }

    function setRunning(running) {
      renderButton.disabled = running;
      stopButton.disabled = !running;
    }

    async function render() {
      const cfg = settings();
      const width = cfg.sampleSize;
      const height = cfg.sampleSize;
      canvas.width = width;
      canvas.height = height;
      sampleReadoutEl.textContent = `${cfg.worldExtent} x ${cfg.worldExtent} world sample to ${width} x ${height} image`;
      cancelRender = false;
      setRunning(true);
      progressEl.style.width = "0%";
      statusEl.textContent = "Rendering";

      const image = ctx.createImageData(width, height);
      const values = new Float32Array(width * height);
      const groundnessValues = new Float32Array(width * height);
      const counts = new Array(bands.length).fill(0);
      let min = Infinity;
      let max = -Infinity;
      let sum = 0;
      const started = performance.now();

      for (let y = 0; y < height; y++) {
        if (cancelRender) {
          statusEl.textContent = "Stopped";
          setRunning(false);
          return;
        }

        for (let x = 0; x < width; x++) {
          const worldX = x * cfg.worldExtent / width;
          const worldZ = y * cfg.worldExtent / height;
          const sample = terrainAt(worldX, worldZ, cfg);
          const value = valueForMode(sample, cfg.viewMode);
          const index = y * width + x;
          values[index] = value;
          groundnessValues[index] = sample.gnd;
          min = Math.min(min, value);
          max = Math.max(max, value);
          sum += value;
          counts[bandIndex(sample.gnd)]++;
          const color = colorForValue(value, cfg.viewMode);
          const p = index * 4;
          image.data[p + 0] = color[0];
          image.data[p + 1] = color[1];
          image.data[p + 2] = color[2];
          image.data[p + 3] = 255;
        }

        if ((y & 7) === 7) {
          progressEl.style.width = `${Math.round((y + 1) * 100 / height)}%`;
          await new Promise(requestAnimationFrame);
        }
      }

      ctx.putImageData(image, 0, 0);
      lastValues = values;
      lastGroundness = groundnessValues;
      lastSettings = cfg;
      const elapsed = performance.now() - started;
      progressEl.style.width = "100%";
      statusEl.textContent = `Rendered ${cfg.viewMode} ${width} x ${height} in ${elapsed.toFixed(0)} ms`;
      minMaxEl.textContent = `min ${min.toFixed(3)}, max ${max.toFixed(3)}, avg ${(sum / values.length).toFixed(3)}`;
      bandStatsEl.innerHTML = "";
      for (let i = 0; i < bands.length; i++) {
        const line = document.createElement("div");
        line.className = "stat";
        line.textContent = `${bands[i].name}: ${(counts[i] * 100 / values.length).toFixed(2)}%`;
        bandStatsEl.appendChild(line);
      }
      setRunning(false);
    }

    canvas.addEventListener("mousemove", (event) => {
      if (!lastValues || !lastGroundness || !lastSettings) {
        return;
      }
      const rect = canvas.getBoundingClientRect();
      const x = Math.max(0, Math.min(lastSettings.sampleSize - 1, Math.floor((event.clientX - rect.left) * lastSettings.sampleSize / rect.width)));
      const y = Math.max(0, Math.min(lastSettings.sampleSize - 1, Math.floor((event.clientY - rect.top) * lastSettings.sampleSize / rect.height)));
      const value = lastValues[y * lastSettings.sampleSize + x];
      const gnd = lastGroundness[y * lastSettings.sampleSize + x];
      const worldX = x * lastSettings.worldExtent / lastSettings.sampleSize;
      const worldZ = y * lastSettings.worldExtent / lastSettings.sampleSize;
      cursorEl.textContent = `x ${worldX.toFixed(0)}, z ${worldZ.toFixed(0)}, ${lastSettings.viewMode} ${value.toFixed(3)}, gnd ${gnd.toFixed(3)}, ${bandName(gnd)}`;
    });

    renderButton.addEventListener("click", render);
    stopButton.addEventListener("click", () => {
      cancelRender = true;
    });

    render();
  </script>
</body>
</html>
